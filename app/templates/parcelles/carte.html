{% extends "base.html" %}
{% block title %}Carte des parcelles — ANCAR{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="ancar-title mb-0">Carte des parcelles</h3>
  <a href="{{ url_for('parcelles.liste') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-list-ul"></i> Liste</a>
</div>
<div id="map" style="height: 72vh; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1);"></div>
<p id="msg" class="text-muted small mt-2"></p>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([14.5, -14.7], 7);
const _osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
});
const _sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Imagerie © Esri, Maxar, Earthstar Geographics'
}).addTo(map);
L.control.layers({ "Satellite (RGB)": _sat, "Plan (OSM)": _osm }, null, { position: 'topright' }).addTo(map);

// Code couleur santÃ© (Ã©chelle QGIS 5 classes)
const C_ROUGE='#d73027', C_ORANGE='#F39C12', C_JAUNE='#F4D03F', C_VERTC='#a6d96a', C_VERT='#1a9850', C_GRIS='#bdbdbd';
function couleurEtat(ndvi){
  if (ndvi == null) return C_GRIS;
  if (ndvi < 0.10) return C_ROUGE;
  if (ndvi < 0.20) return C_ORANGE;
  if (ndvi < 0.35) return C_JAUNE;
  if (ndvi < 0.55) return C_VERTC;
  return C_VERT;
}
function etatTexte(ndvi){
  if (ndvi == null) return 'Non calculé';
  if (ndvi < 0.10) return 'Sol nu / Échec';
  if (ndvi < 0.20) return 'Végétation critique';
  if (ndvi < 0.35) return 'Retard / À surveiller';
  if (ndvi < 0.55) return 'Bon comportement';
  return 'Excellent développement';
}
const legendeSig = L.control({ position: 'bottomright' });
legendeSig.onAdd = function () {
  const d = L.DomUtil.create('div', 'card p-2 shadow-sm');
  d.style.background = '#fff';
  function li(c,t){ return `<div class="small"><span style="display:inline-block;width:14px;height:14px;background:${c};margin-right:4px;border:1px solid #999"></span>${t}</div>`; }
  d.innerHTML = '<div class="small fw-semibold mb-1">Santé des cultures (NDVI)</div>' +
    li(C_ROUGE,'Sol nu / Échec') + li(C_ORANGE,'Végétation critique') +
    li(C_JAUNE,'Retard / À surveiller') + li(C_VERTC,'Bon comportement') +
    li(C_VERT,'Excellent développement') + li(C_GRIS,'Non calculé');
  return d;
};
legendeSig.addTo(map);

fetch("{{ url_for('parcelles.geojson') }}")
  .then(r => r.json())
  .then(data => {
    if (!data.features || !data.features.length) {
      document.getElementById('msg').textContent =
        "Aucune parcelle géolocalisée pour le moment.";
      return;
    }
    const layer = L.geoJSON(data, {
      style: f => ({ color: '#333', weight: 1, fillColor: couleurEtat(f.properties.ndvi), fillOpacity: 0.7 }),
      onEachFeature: (f, l) => {
        const p = f.properties;
        const surf = p.surface_ha != null ? p.surface_ha.toFixed(2) + ' ha' : '—';
        const et = etatTexte(p.ndvi);
        l.bindTooltip(
          `<b>${p.code || 'Parcelle #' + p.id}</b><br>` +
          `Producteur : ${p.producteur || '—'}<br>` +
          `Culture : ${p.culture || '—'}<br>` +
          `Surface : ${surf}<br>` +
          `État : <span style="color:${couleurEtat(p.ndvi)}">${et}</span>`,
          { sticky: true, direction: 'top', opacity: 0.95 }
        );
        l.bindPopup(
          `<b>${p.code || 'Parcelle #' + p.id}</b><br>` +
          `Producteur : ${p.producteur || '—'}<br>` +
          `Culture : ${p.culture || '—'}<br>` +
          `Surface : ${surf}<br>` +
          `État (NDVI) : <span style="color:${couleurEtat(p.ndvi)}">${et}</span><br>` +
          `<a href="/parcelles/${p.id}/fiche">Voir la fiche</a>`
        );
      }
    }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [20, 20] });
    document.getElementById('msg').textContent =
      data.features.length + " parcelle(s) affichée(s).";
  })
  .catch(() => {
    document.getElementById('msg').textContent = "Erreur de chargement des parcelles.";
  });
</script>
{% endblock %}
