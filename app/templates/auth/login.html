{% extends "base.html" %}
{% block title %}Connexion — ANCAR{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 mt-5">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <img src="{{ url_for('static', filename='img/logo_ancar.png') }}" alt="ANCAR" style="max-height:70px" class="mb-2">
          <h4 class="mt-2 mb-0 ancar-title">ANCAR SIG</h4>
          <p class="text-muted small">Plateforme Nationale de Suivi Intelligent<br>des Exploitations Agricoles</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label">Adresse e-mail</label>
            <input type="email" name="email" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn ancar-btn w-100">
            <i class="bi bi-box-arrow-in-right"></i> Se connecter
          </button>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">© ANCAR — {{ app_nom }}</p>
  </div>
</div>
{% endblock %}
