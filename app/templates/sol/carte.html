{% extends "base.html" %}
{% block title %}Carte des sols — ANCAR SIG{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
  <h3 class="ancar-title mb-0">Carte des sols</h3>
  <div class="d-flex gap-2 align-items-center">
    <select id="param" class="form-select form-select-sm" style="width:auto">
      <option value="fertilite">Fertilité (synthèse)</option>
      <option value="ph">pH eau</option>
      <option value="p_olsen">Phosphore (Olsen)</option>
      <option value="k">Potassium</option>
      <option value="mo">Matière organique</option>
      <option value="n">Azote total</option>
      <option value="texture">Texture</option>
    </select>
    <a href="{{ url_for('sol.liste') }}" class="btn btn-outline-secondary btn-sm">Liste</a>
  </div>
</div>
<div id="map" style="height:72vh;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1)"></div>
<p id="msg" class="text-muted small mt-2">Chargement…</p>
{% endblock %}
{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([14.2, -15.6], 7);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OSM'});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom: 19, attribution: 'Imagerie © Esri, Maxar'}).addTo(map);
const ptsLayer = L.layerGroup();
L.control.layers({"Satellite (RGB)": sat, "Plan (OSM)": osm}, {"Points IFDC": ptsLayer}, {position: 'topright'}).addTo(map);

const ROUGE = '#d73027', ORANGE = '#fc8d59', JAUNE = '#fee08b', VERT_C = '#91cf60', VERT = '#1a9850', GRIS = '#bdbdbd';
// Classes : mêmes seuils que app/sol/referentiel.py
const ECHELLES = {
  fertilite: {titre: 'Fertilité', cat: {'Faible': ROUGE, 'Moyenne': JAUNE, 'Bonne': VERT}},
  ph: {titre: 'pH eau', seuils: [5.0, 5.5, 6.5, 7.5], couleurs: [ROUGE, ORANGE, JAUNE, VERT, '#4575b4'],
       libelles: ['< 5,0 très acide', '5,0–5,5 acide', '5,5–6,5 légèrement acide', '6,5–7,5 neutre', '> 7,5 basique']},
  p_olsen: {titre: 'P Olsen (ppm)', seuils: [10, 20], couleurs: [ROUGE, JAUNE, VERT], libelles: ['< 10 faible', '10–20 moyen', '> 20 élevé']},
  k: {titre: 'K (ppm)', seuils: [78, 156], couleurs: [ROUGE, JAUNE, VERT], libelles: ['< 78 faible', '78–156 moyen', '> 156 élevé']},
  mo: {titre: 'MO (%)', seuils: [1, 2], couleurs: [ROUGE, JAUNE, VERT], libelles: ['< 1 faible', '1–2 moyen', '> 2 élevé']},
  n: {titre: 'N total (%)', seuils: [0.05, 0.1], couleurs: [ROUGE, JAUNE, VERT], libelles: ['< 0,05 faible', '0,05–0,1 moyen', '> 0,1 élevé']},
  texture: {titre: 'Texture', cat: {'Sable': '#f6e8c3', 'Sable limoneux': '#dfc27d', 'Limon sableux': '#bf812d',
            'Limon': '#8c510a', 'Limon argilo-sableux': '#80cdc1', 'Limon argileux': '#35978f', 'Argile': '#01665e'}},
};
function couleur(param, v) {
  const e = ECHELLES[param];
  if (v === null || v === undefined) return GRIS;
  if (e.cat) return e.cat[v] || GRIS;
  for (let i = 0; i < e.seuils.length; i++) if (v < e.seuils[i]) return e.couleurs[i];
  return e.couleurs[e.couleurs.length - 1];
}
const fmt = (v, d) => (v === null || v === undefined) ? '—' : Number(v).toFixed(d).replace('.', ',');

let couche = null, donnees = null;
const legende = L.control({position: 'bottomright'});
legende.onAdd = function () { this._div = L.DomUtil.create('div', 'card p-2 shadow-sm small'); this._div.style.background = '#fff'; return this._div; };
legende.addTo(map);
function majLegende(param) {
  const e = ECHELLES[param];
  const items = e.cat ? Object.entries(e.cat) : e.libelles.map((l, i) => [l, e.couleurs[i]]);
  legende._div.innerHTML = '<div class="fw-semibold mb-1">' + e.titre + '</div>' +
    items.map(([l, c]) => '<div><span style="display:inline-block;width:14px;height:14px;background:' + c + ';margin-right:4px;vertical-align:middle"></span>' + l + '</div>').join('') +
    '<div><span style="display:inline-block;width:14px;height:14px;background:' + GRIS + ';margin-right:4px;vertical-align:middle"></span>Sans donnée</div>';
}
function dessiner() {
  const param = document.getElementById('param').value;
  if (couche) map.removeLayer(couche);
  couche = L.geoJSON(donnees, {
    style: f => ({color: f.properties.origine === 'CAR' ? '#1565c0' : '#333', weight: f.properties.origine === 'CAR' ? 2 : 0.6,
                  fillColor: couleur(param, f.properties[param]), fillOpacity: .8}),
    onEachFeature: (f, l) => {
      const p = f.properties;
      l.bindPopup('<b>' + p.code + '</b> · ' + (p.commune || '') +
        '<br>pH ' + fmt(p.ph, 1) + ' · P ' + fmt(p.p_olsen, 1) + ' ppm · K ' + fmt(p.k, 0) + ' ppm' +
        '<br>MO ' + fmt(p.mo, 2) + ' % · N ' + fmt(p.n, 3) + ' %' +
        '<br>Texture : ' + (p.texture || '—') + '<br>Fertilité : <b>' + (p.fertilite || '—') + '</b>' +
        (p.contraintes ? '<br><span class="text-danger">' + p.contraintes + '</span>' : '') +
        '<br><span class="text-muted">' + (p.origine === 'CAR' ? 'Saisie CAR' : (p.fiabilite || 'Non rattachée')) + '</span>' +
        '<br><a href="/sol/parcelle/' + p.id + '">Voir / saisir le sol</a>');
    }
  }).addTo(map);
  majLegende(param);
}
document.getElementById('param').addEventListener('change', dessiner);

fetch("{{ url_for('sol.geojson') }}").then(r => r.json()).then(d => {
  donnees = d;
  if (!d.features.length) { document.getElementById('msg').textContent = 'Aucune parcelle dans votre périmètre.'; return; }
  dessiner();
  map.fitBounds(couche.getBounds(), {padding: [20, 20]});
  const avec = d.features.filter(f => f.properties.ph !== undefined && f.properties.ph !== null).length;
  document.getElementById('msg').textContent = d.features.length + ' parcelle(s), dont ' + avec +
    ' avec données de sol. Contour bleu : analyse saisie par le CAR.';
});
let ptsCharges = false;
map.on('overlayadd', e => {
  if (e.layer !== ptsLayer || ptsCharges) return;
  ptsCharges = true;
  fetch("{{ url_for('sol.points_geojson') }}").then(r => r.json()).then(d => {
    L.geoJSON(d, {pointToLayer: (f, ll) => L.circleMarker(ll, {radius: 3, color: '#000', weight: 1, fillColor: '#fff', fillOpacity: 1}),
      onEachFeature: (f, l) => l.bindPopup('<b>' + f.properties.code + '</b><br>pH ' + fmt(f.properties.ph, 1) +
        ' · P ' + fmt(f.properties.p_olsen, 1) + ' ppm · MO ' + fmt(f.properties.mo, 2) + ' %')}).addTo(ptsLayer);
  });
});
</script>
{% endblock %}
